name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/cms-lab-core/cms-labs-terminal:${{ steps.version.outputs.value }}
            ghcr.io/cms-lab-core/cms-labs-terminal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package Helm chart
        run: >-
          helm package charts/cms-labs-terminal
          --destination dist
          --version "${{ steps.version.outputs.value }}"
          --app-version "${{ steps.version.outputs.value }}"
      - name: Login Helm to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish Helm OCI chart
        run: helm push "dist/cms-labs-terminal-${{ steps.version.outputs.value }}.tgz" oci://ghcr.io/cms-lab-core/charts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
