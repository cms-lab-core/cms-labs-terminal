repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: sh -c 'files=$(git diff --cached --name-only --diff-filter=ACMR -- "*.go"); test -z "$files" || test -z "$(gofmt -l $files)"'
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
