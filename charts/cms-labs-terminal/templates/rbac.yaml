apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cms-labs-terminal.fullname" . }}
  labels:
    {{- include "cms-labs-terminal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cms-labs-terminal.fullname" . }}
  labels:
    {{- include "cms-labs-terminal.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cms-labs-terminal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cms-labs-terminal.fullname" . }}
