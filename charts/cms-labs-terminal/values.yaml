image:
  repository: ghcr.io/cms-lab-core/cms-labs-terminal
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  reconcileInterval: 15s
  sourceName: cms-labs-terminal-config
  sourceLabel: cms-labs.io/terminal-config
  managedNamespaceLabel: app.kubernetes.io/managed-by
  managedNamespaceValue: clabgate
  proxyNamespace: cms-labs-system
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
