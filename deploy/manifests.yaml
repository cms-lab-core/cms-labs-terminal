# Minimal lab declaration consumed by the cluster-wide cms-labs-terminal controller.
# Clabgate normally creates the namespace and replaces $NAME while applying a task bundle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-labs-terminal-config
  namespace: $NAME
  labels:
    cms-labs.io/terminal-config: "true"
data:
  config.yaml: |-
    targets:
      - name: r1
        label: Router 1
        mode: exec
        command: [/bin/bash, -l]
      - name: s1
        label: Switch 1
        mode: exec
        command: [/bin/ash, -l]
